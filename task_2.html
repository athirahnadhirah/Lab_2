<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Conference Registration Form</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4d9f5;
            margin: 30px;
        }
        h1 {
            text-align: center;
            color: #9400a5;
        }
        form {
            width: 60%;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #a604b1;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #b0bec5;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .radio-group,
        .checkbox-group {
            margin-top: 8px;
        }
        .radio-group label,
        .checkbox-group label {
            display: inline-block;
            font-weight: normal;
            margin-right: 20px;
            color: #333;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .required {
            color: red;
        }
        button {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #dd84e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #cb8dd6;
        }
    </style>
</head>
<body>

    <h1>Conference Registration Form</h1>

    <form action="#" method="post">

        <label for="fullname">Full Name <span class="required">*</span></label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>

        <label for="age">Age <span class="required">*</span></label>
        <input type="number" id="age" name="age" min="18" max="99" placeholder="18" required>

        <label>Gender:</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
        </div>

        <label for="country">Country of Residence:</label>
        <select id="country" name="country">
            <option value="Malaysia" selected>Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Thailand">Thailand</option>
            <option value="Other">Other</option>
        </select>

        <label>Areas of Interest:</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="interest" value="software"> Software Development</label>
            <label><input type="checkbox" name="interest" value="web"> Web Technology</label>
            <label><input type="checkbox" name="interest" value="cyber"> Cybersecurity</label>
            <label><input type="checkbox" name="interest" value="ai"> Artificial Intelligence</label>
        </div>

        <label>Experience Level:</label>
        <div class="radio-group">
            <label><input type="radio" name="experience" value="beginner" required> Beginner</label>
            <label><input type="radio" name="experience" value="intermediate"> Intermediate</label>
            <label><input type="radio" name="experience" value="advanced"> Advanced</label>
        </div>

        <label for="comments">Comments or Questions:</label>
        <textarea id="comments" name="comments" placeholder="Any comments or questions?"></textarea>

        <button type="submit">Register</button>

    </form>

</body>
</html>
